name: Build WinPE User Manager (x64)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Visual Studio (vswhere)
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > vswhere_path.txt
          type vswhere_path.txt

      - name: Build with MSVC (x64, static CRT /MT)
        shell: cmd
        run: |
          set "VS_PATH="
          for /f "usebackq delims=" %%I in (vswhere_path.txt) do set "VS_PATH=%%I"
          if "%VS_PATH%"=="" (
            echo Visual Studio installation not found
            exit /b 1
          )
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          echo Compiling UserManager.cpp ...
          cl /nologo /W4 /EHsc /DUNICODE /D_UNICODE /MT /O2 UserManager.cpp /link /SUBSYSTEM:WINDOWS /MACHINE:X64 /OUT:UserManager.exe
          if errorlevel 1 exit /b 1
          if not exist UserManager.exe exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UserManager-x64
          path: UserManager.exe
          if-no-files-found: error